services:
  server:
    build:
      context: ./server
    environment:
      PORT: ${API_PORT:-4000}
      DATABASE_PATH: /app/data/tripstack.db
    volumes:
      - ./data:/app/data
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"

  client:
    build:
      context: ./client
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - server
