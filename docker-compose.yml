services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-tripstack1234}
      MYSQL_DATABASE: ${DB_NAME:-tripstack}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  server:
    build:
      context: ./server
    environment:
      PORT: ${API_PORT:-4000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-tripstack1234}
      DB_NAME: ${DB_NAME:-tripstack}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    depends_on:
      - mysql

  client:
    build:
      context: ./client
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api
      NEXT_PUBLIC_GEOAPIFY_API_KEY: ${NEXT_PUBLIC_GEOAPIFY_API_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - server

volumes:
  mysql-data:
